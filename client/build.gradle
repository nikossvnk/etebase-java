plugins {
    id 'com.android.library'
    id 'maven-publish'
}

final nativeRoot = projectDir.parentFile
final nativePrebuilt = providers.gradleProperty('etebaseNativePrebuilt').map { it.toBoolean() }.getOrElse(false)
final buildNative = tasks.register('buildNative', Exec) {
    workingDir nativeRoot
    commandLine 'bash', new File(nativeRoot, 'build.sh').absolutePath, 'android'
    inputs.files(new File(nativeRoot, 'Cargo.toml'), new File(nativeRoot, 'Cargo.lock'),
            new File(nativeRoot, 'rust-toolchain.toml'), new File(nativeRoot, 'build.rs'),
            new File(nativeRoot, 'build.sh'))
    inputs.dir(new File(nativeRoot, 'src'))
    outputs.dir(layout.buildDirectory.dir('generated/jniLibs'))
    outputs.dir(layout.buildDirectory.dir('generated/sources/etebase/java'))
    onlyIf { !nativePrebuilt }
}

android {
    namespace 'com.etebase.client'
    compileSdk { version = release(37) }
    ndkVersion '30.0.16248370'
    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main {
        java.setSrcDirs(['src/main/java/com/etebase/client/exceptions',
                         'src/main/java/com/etebase/client/http_bridge',
                         'src/main/java/com/etebase/client/internal',
                         'build/generated/sources/etebase/java'])
        jniLibs.setSrcDirs(['build/generated/jniLibs'])
    }
    publishing { singleVariant('release') { withSourcesJar() } }
}
tasks.named('preBuild').configure { dependsOn buildNative }
dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    api 'com.squareup.okhttp3:okhttp:5.5.1'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'client'
            }
        }
    }
}

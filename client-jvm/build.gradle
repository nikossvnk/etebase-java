plugins {
    id 'java-library'
    id 'maven-publish'
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
final nativeRoot = projectDir.parentFile
final nativePrebuilt = providers.gradleProperty('etebaseNativePrebuilt').map { it.toBoolean() }.getOrElse(false)
final buildNative = tasks.register('buildNative', Exec) {
    workingDir nativeRoot
    commandLine 'bash', new File(nativeRoot, 'build.sh').absolutePath, 'jvm'
    inputs.files(new File(nativeRoot, 'Cargo.toml'), new File(nativeRoot, 'Cargo.lock'),
            new File(nativeRoot, 'build.rs'), new File(nativeRoot, 'build.sh'),
            new File(nativeRoot, 'rust-toolchain.toml'))
    inputs.dir(new File(nativeRoot, 'src'))
    outputs.dir(layout.buildDirectory.dir('generated/sources/etebase/java'))
    outputs.dir(layout.buildDirectory.dir('generated/resources'))
    onlyIf { !nativePrebuilt }
}
final copySharedJavaSources = tasks.register('copySharedJavaSources', Copy) {
    from('../client/src/main/java') {
        include 'com/etebase/client/exceptions/**'
        include 'com/etebase/client/http_bridge/**'
    }
    into layout.buildDirectory.dir('generated-src/shared/java')
}
sourceSets.main {
    java.setSrcDirs(['src/main/java/com/etebase/client/annotation',
                     'src/main/java/com/etebase/client/internal',
                     'build/generated/sources/etebase/java'])
    java.srcDir copySharedJavaSources
    resources.setSrcDirs(['build/generated/resources'])
}
tasks.named('compileJava').configure { dependsOn buildNative }
tasks.named('processResources').configure { dependsOn buildNative }
tasks.named('sourcesJar').configure { dependsOn buildNative, copySharedJavaSources }
dependencies {
    api 'com.squareup.okhttp3:okhttp:5.5.1'
    testImplementation 'junit:junit:4.13.2'
}
publishing {
    publications {
        release(MavenPublication) { from components.java; artifactId = 'client-jvm' }
    }
}

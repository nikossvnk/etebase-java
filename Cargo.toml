[package]
name = "etebase-uniffi"
description = "UniFFI Kotlin bindings to etebase-rs (Android and desktop JVM)"
homepage = "https://www.etebase.com"
repository = "https://github.com/nikossvnk/etebase-java"
version = "3.0.0"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
name = "etebase_uniffi"
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = "0.32.2"
etebase = { git = "https://github.com/nikossvnk/etebase-rs", rev = "eee354b5af21243f93c3f45f70baa98232d713b4", default-features = false }

[workspace]
members = [".", "uniffi-bindgen"]
resolver = "3"

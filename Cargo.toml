[package]
name = "etebase-jni"
description = "JNI bindings to etebase-rs (Android and desktop JVM)"
homepage = "https://www.etebase.com"
repository = "https://github.com/nikossvnk/etebase-java"
version = "2.4.0"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
rust-version = "1.99.1"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
flapigen = "0.12.3"
env_logger = "0.11.11"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "visit"] }

[dependencies]
log = "0.4.35"
log-panics = { version = "2.1.0", optional = true }
android_logger = { version = "0.15.1", optional = true }
# flapigen's generated JNI ABI uses the maintained 0.3 compatibility layer over jni-sys 0.4.
jni-sys = "0.4.1"
etebase = { git = "https://github.com/nikossvnk/etebase-rs", rev = "a536d83c2542e1532131a781c3436f24139a3d18", default-features = false }


[features]
default = ["android"]
android = ["android_logger", "log-panics"]
jvm = []

name: Check

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: '30.0.16248370'

jobs:
  rust-lint:
    name: Rust format and Clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (bindings and uniffi-bindgen)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  android-native:
    name: Android / ${{ matrix.abi }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION"

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build locked native library and verify 16 KB ELF alignment
        env:
          ABI: ${{ matrix.abi }}
        run: ./build.sh android "$ABI"

      - name: Keep native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-${{ matrix.abi }}
          path: client/build/generated/jniLibs/
          if-no-files-found: error
          retention-days: 7

  desktop-native:
    name: JVM / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: darwin-x86-64
            target: x86_64-apple-darwin
          - runner: ubuntu-26.04
            platform: linux-x86-64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            platform: win32-x86-64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config

      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Start disposable Etebase test server
        if: runner.os == 'Linux'
        run: |
          docker run -d -p 127.0.0.1:3735:3735 ghcr.io/nikossvnk/ciphwren-server/test-server:latest
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3735/api/v1/authentication/is_etebase/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3735/api/v1/authentication/is_etebase/
          echo ETEBASE_SERVER_URL=http://127.0.0.1:3735 >> "$GITHUB_ENV"

      - name: Build locked desktop library
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: ./build.sh jvm "$RUST_TARGET"

      - name: Run Kotlin tests against this host's real library
        run: >-
          ./gradlew -PjvmOnly -PetebaseNativePrebuilt=true
          ${ETEBASE_SERVER_URL:+-PetebaseServerUrl=$ETEBASE_SERVER_URL}
          :client-jvm:test :client-jvm:jar --no-daemon

      - name: Keep native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-native-${{ matrix.platform }}
          path: client-jvm/build/generated/resources/
          if-no-files-found: error
          retention-days: 7

      - name: Keep JVM test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jvm-reports-${{ matrix.platform }}
          path: client-jvm/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  assemble-android:
    name: Assemble and lint four-ABI AAR
    needs: android-native
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install pinned Android SDK and NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$ANDROID_NDK_VERSION"'

      # uniffi-bindgen generates the Kotlin bindings from the downloaded libraries.
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-native-*
          path: client/build/generated/jniLibs/
          merge-multiple: true

      - name: Assemble and lint without rebuilding downloaded native inputs
        run: ./gradlew -PetebaseNativePrebuilt=true :client:assembleRelease :client:lintRelease :client:compileDebugAndroidTestKotlin --no-daemon

      - name: Verify four ABIs with 16 KB ELF alignment in the AAR
        run: |
          readelf="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          contents=$(mktemp -d)
          unzip -q client/build/outputs/aar/client-release.aar 'jni/*' -d "$contents"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            "$readelf" -lW "$contents/jni/$abi/libetebase_uniffi.so" | awk '
              $1 == "LOAD" { found = 1; if ($NF != "0x4000" && $NF != "0x10000") bad = 1 }
              END { exit (!found || bad) }'
          done

      - name: Keep Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: client/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etebase-client-aar
          path: client/build/outputs/aar/client-release.aar
          if-no-files-found: error

  assemble-jvm:
    name: Assemble and test five-platform JVM JAR
    needs: desktop-native
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # uniffi-bindgen generates the Kotlin bindings from the downloaded libraries.
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-native-*
          path: client-jvm/build/generated/resources/
          merge-multiple: true

      - name: Assemble and test without rebuilding downloaded native inputs
        run: ./gradlew -PjvmOnly -PetebaseNativePrebuilt=true :client-jvm:test :client-jvm:jar --no-daemon

      - name: Verify the JAR contains all five JNA platform libraries
        run: |
          listing=$(unzip -Z1 client-jvm/build/libs/client-jvm-*[0-9].jar)
          for library in linux-x86-64/libetebase_uniffi.so linux-aarch64/libetebase_uniffi.so \
              darwin-aarch64/libetebase_uniffi.dylib darwin-x86-64/libetebase_uniffi.dylib \
              win32-x86-64/etebase_uniffi.dll; do
            grep -qxF "$library" <<< "$listing" || { echo "missing $library" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etebase-client-jvm-jar
          path: client-jvm/build/libs/*.jar
          if-no-files-found: error
